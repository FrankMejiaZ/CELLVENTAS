name: cellventas

services:
  # Base de Datos Relacional PostgreSQL 16
  cellventas-db:
    image: postgres:16-alpine
    container_name: cellventas-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-valetec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valetec_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cellventas_db}
    ports:
      - "5434:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-valetec} -d ${POSTGRES_DB:-cellventas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servicio Backend Node.js
  cellventas-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cellventas-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8092}:8092"
    environment:
      - PORT=8092
      - NODE_ENV=${NODE_ENV:-production}
      - POSTGRES_HOST=cellventas-db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-valetec}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-valetec_secure_pass}
      - POSTGRES_DB=${POSTGRES_DB:-cellventas_db}
      - JWT_SECRET=${JWT_SECRET:-cellventas_jwt_secret_key_2026}
    depends_on:
      cellventas-db:
        condition: service_healthy

  # Servicio Frontend Nginx Web Server
  cellventas-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cellventas-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3006}:80"
    depends_on:
      - cellventas-backend
